<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>2048 Game</title>
  <meta name="description" content="The classic 2048 puzzle game with an unlimited undo option, an adjustable board from 3x3 to 8x8, night mode, and automatic session saving. Play with the arrow keys, WASD, or swipe on mobile.">
  <link href="style/main.css" rel="stylesheet" type="text/css">
  <link rel="icon" href="favicon.ico" sizes="any">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="HandheldFriendly" content="True">
  <meta name="MobileOptimized" content="320">
  <meta name="viewport" content="width=device-width, target-densitydpi=160dpi, initial-scale=1.0, maximum-scale=1, user-scalable=no, minimal-ui">
  <script>
    // Applied before the first paint so reloading in night mode never flashes
    // a white page. Kept in sync by js/theme_manager.js.
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  </script>
</head>
<body>
  <a class="skip-link" href="#game">Skip to the game</a>

  <header class="appbar">
    <div class="appbar-inner">
      <span class="nav-pill" aria-hidden="true"></span>

      <!-- The logo slot: the wordmark alone, marked as the current page so the
           bar's sliding highlight sits behind it. -->
      <a class="brand" href="./index.html" aria-current="page">
        <span class="brand-name">2048</span>
      </a>

      <!-- The two links that used to sit at the bottom of the page. -->
      <nav class="nav" aria-label="Pages">
        <a class="nav-link" href="./how.html">How to play</a>
        <a class="nav-link" href="https://github.com/gabrielecirulli/2048" rel="noopener" target="_blank">Original 2048<svg class="icon-link" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M7.5 15 15 7.5"></path><path d="M9 7.5h6.5V14"></path></svg></a>
      </nav>

      <!-- Undo and New Game, on one line. New Game stays first in the DOM
           because KeyboardInputManager binds the first .restart-button to
           restart; CSS order puts Undo to its left. -->
      <div class="appbar-actions">
        <a class="restart-button">New Game <span class="key-hint">R</span></a>
        <a class="restart-button undo-button disabled">Undo <span class="key-hint">U</span></a>
      </div>

      <button class="theme-toggle" type="button" aria-label="Switch to dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
      </button>
    </div>
  </header>

  <main class="container" id="game">
    <!-- Score and best: back above the board, right-aligned over the size row. -->
    <div class="scores-container">
      <div class="score-container">0</div>
      <div class="best-container">0</div>
    </div>

    <div class="game-area">
      <div class="board-size">
        <label for="board-size-slider">Board size</label>
        <input type="range" id="board-size-slider" class="board-size-slider"
               min="3" max="8" step="1" value="4"
               aria-label="Board size, from 3 by 3 to 8 by 8">
        <span class="board-size-lock" role="img" aria-label="Board size unlocked">
          <svg class="icon-lock-open" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true" focusable="false">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
          </svg>
          <svg class="icon-lock-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true" focusable="false">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </span>
        <span class="board-size-value">4&#215;4</span>
      </div>

      <div class="game-container">
        <div class="game-message">
          <p></p>
          <div class="lower">
            <a class="keep-playing-button">Keep going</a>
            <a class="retry-button">Try again</a>
          </div>
        </div>

        <!-- Filled in by the actuator, which knows how many cells there are. -->
        <div class="grid-container"></div>

        <div class="tile-container"></div>
      </div>

      <div class="confirm-message size-change-message">
        <p></p>
        <div class="lower">
          <a class="size-change-confirm-button">OK</a>
          <a class="size-change-cancel-button">Cancel</a>
        </div>
      </div>

      <div class="confirm-message restart-confirm-message">
        <p></p>
        <div class="lower">
          <a class="restart-confirm-button">OK</a>
          <a class="restart-cancel-button">Cancel</a>
        </div>
      </div>
    </div>

    <p class="game-explanation">
      Use the arrow or WASD keys&mdash;&nbsp;or swipe on touch devices&nbsp;&mdash;
      to play. Equal tiles that collide merge into one. Reach
      <strong>2048</strong> to win, and use <strong>UNDO</strong> as often as you
      like.
    </p>
  </main>

  <script src="js/theme_manager.js"></script>
  <script src="js/nav_pill.js"></script>
  <script src="js/keyboard_input_manager.js"></script>
  <script src="js/html_actuator.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/tile.js"></script>
  <script src="js/local_storage_manager.js"></script>
  <script src="js/game_manager.js"></script>
  <script src="js/application.js"></script>
</body>
</html>
